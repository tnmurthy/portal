name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-port/tt-web-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-port/tt-web-portal/package-lock.json

      - run: npm ci
      - run: npm run type-check
      - run: npm run build
        env:
          VITE_BASE_PATH: /portal/

  mission-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mission-control
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: mission-control/requirements.txt

      - run: pip install -r requirements.txt
      - run: pytest
